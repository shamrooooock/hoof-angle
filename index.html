<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#214f40"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css?v=20261028a"><title>Hoof Angle Notebook</title></head>
<body><header><a href="./" class="brand">♧ <span>SHAMROCK<small data-i18n="club"></small></span></a><div class="preferences"><label><span data-i18n="language"></span><select id="language"><option value="ja">日本語</option><option value="en">English</option><option value="de">Deutsch</option></select></label><label><span data-i18n="theme"></span><select id="theme"><option value="system" data-i18n="system"></option><option value="light" data-i18n="light"></option><option value="dark" data-i18n="dark"></option></select></label></div></header><main>
<section id="updateNotice" hidden aria-live="polite"><button id="applyUpdate" data-i18n="update"></button><p data-i18n="updateHint"></p><p id="updateStatus"></p></section>
<div class="intro"><p class="eyebrow" data-i18n="app"></p><h1 data-i18n="intro"></h1><p data-i18n="introSub"></p><span class="badge" data-i18n="local"></span></div>
<ol class="steps"><li id="step1" class="active" data-i18n="step1"></li><li id="step2" data-i18n="step2"></li><li id="step3" data-i18n="step3"></li></ol>
<div class="layout"><section class="measurement"><div class="section-head"><h2 data-i18n="photo"></h2><span id="fileName"></span></div>
<div id="viewport"><canvas id="canvas" tabindex="0" data-i18n-aria="canvas"></canvas><div id="empty"><span class="photo-icon">＋</span><h3 data-i18n="add"></h3><p data-i18n="photoHelp"></p><button id="emptyPick" class="primary" data-i18n="pick"></button><small data-i18n="formats"></small></div><span id="zoomBadge" hidden>100%</span></div>
<div class="toolbar"><div><button id="zoomOut" disabled data-i18n-aria="out">−</button><button id="fit" disabled data-i18n="fit"></button><button id="zoomIn" disabled data-i18n-aria="in">＋</button></div><button id="reset" disabled data-i18n="reset"></button></div>
<p id="status" role="status"></p>
<div class="point-controls"><button id="selectA" disabled><span class="dot a">A</span><span><span data-i18n="pointA"></span><small data-i18n="descA"></small></span><span id="stateA"></span></button><button id="selectB" disabled><span class="dot b">B</span><span><span data-i18n="pointB"></span><small data-i18n="descB"></small></span><span id="stateB"></span></button></div>
<p class="hint" data-i18n="hint"></p>
<div class="photo-actions"><button id="pick" data-i18n="change"></button><button id="camera" data-i18n="camera"></button></div><input id="file" type="file" accept="image/*" hidden><input id="capture" type="file" accept="image/*" capture="environment" hidden></section>
<aside><section class="metadata"><h2 data-i18n="details"></h2><label><span data-i18n="horse"></span><input id="horse" type="text" maxlength="160" autocomplete="off" data-i18n-placeholder="horseHint"></label><div class="metadata-row"><label><span data-i18n="limb"></span><select id="limb"><option value="RF" data-i18n="RF"></option><option value="LF" data-i18n="LF"></option><option value="RH" data-i18n="RH"></option><option value="LH" data-i18n="LH"></option></select></label><label><span data-i18n="date"></span><input id="photoDate" type="date"></label></div></section>
<section class="results"><h2 data-i18n="results"></h2><div class="result-main"><span data-i18n="angle"></span><div><strong id="angle">—</strong> °</div><small data-i18n="angleHelp"></small></div><div class="result-est"><span id="estimateLabel"></span><div><strong id="estimate">—</strong> °</div><p id="direction"></p></div><p class="formula" data-i18n="formula"></p><button id="save" class="primary" disabled data-i18n="save"></button><p class="save-note" data-i18n="saveNote"></p><a id="download" hidden data-i18n="download"></a></section>
<div class="notice"><b data-i18n="noticeTitle"></b><p data-i18n="notice"></p></div></aside></div>
<details><summary><span data-i18n="tips"></span><span>＋</span></summary><div class="guide"><div><h3 data-i18n="tip1"></h3><p data-i18n="tip1Body"></p></div><div><h3 data-i18n="tip2"></h3><p data-i18n="tip2Body"></p></div><div><h3 data-i18n="tip3"></h3><p data-i18n="tip3Body"></p></div><div><h3 data-i18n="tip4"></h3><p data-i18n="tip4Body"></p></div></div></details>
<footer><span>♧ SHAMROCK · <span data-i18n="app"></span> v1.2 <small>(20261028a)</small></span><span id="offline"></span></footer></main><script type="module" src="./app.js?v=20261028a"></script></body></html>
